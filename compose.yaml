name: scientrag

# Shared by every service that runs project code. Source is bind-mounted so
# edits on the host reach the container without rebuilding the image.
x-app: &app
  build:
    context: .
    target: api
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://scientrag:${POSTGRES_PASSWORD}@postgres:5432/scientrag
    STORAGE_DIR: /data/storage
    QDRANT_URL: http://qdrant:6333
    # Set OTLP_ENDPOINT= (empty) in .env to send no traces.
    OTLP_ENDPOINT: ${OTLP_ENDPOINT-http://phoenix:6006/v1/traces}
  volumes:
    - ./src:/app/src
    - ./apps:/app/apps
    - ./tests:/app/tests
    - ./alembic.ini:/app/alembic.ini
    - ./pyproject.toml:/app/pyproject.toml
    - storage:/data/storage
    # Evaluation: question sets and configs in, downloaded data and results out.
    - ./eval:/app/eval
    - ./eval-data:/app/eval-data
    - ./eval-results:/app/eval-results

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: scientrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scientrag
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scientrag -d scientrag"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_data:/qdrant/storage

  # Shows what happened inside each answered question: the passages found, the
  # ranking, the model calls. It holds questions and paper text, so the port is local only.
  phoenix:
    image: arizephoenix/phoenix:version-20.19.0
    environment:
      PHOENIX_WORKING_DIR: /data
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix_data:/data

  migrate:
    <<: *app
    command: sh -c "alembic upgrade head && python -m scientrag.ingestion.queue"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --reload-dir apps/api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Turns uploaded PDFs into searchable chunks. Also the image the tests run in,
  # because it is the only one with the PDF parser installed.
  worker:
    <<: *app
    build:
      context: .
      target: worker
    command: python -m apps.worker.main
    volumes:
      - ./src:/app/src
      - ./apps:/app/apps
      - ./tests:/app/tests
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml
      - storage:/data/storage
      - models:/models
      - ./eval:/app/eval
      - ./eval-data:/app/eval-data
      - ./eval-results:/app/eval-results
    # The parser peaks around 2.5 GB on a long paper; fail loudly rather than swap.
    mem_limit: 4g
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # The web app. Open http://localhost:3000. It reaches the API through its own /api path,
  # so the browser talks to one origin only.
  web:
    build:
      context: apps/web
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      API_URL: http://api:8000
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      # Packages and build output stay in the container: the ones on the host,
      # if any, were built for another operating system.
      - web_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  models:
  phoenix_data:
  postgres_data:
  qdrant_data:
  storage:
  web_modules:
  web_next:
