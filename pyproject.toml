[project]
name = "scirag"
version = "0.1.0"
description = "Question answering over scientific papers with citations."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "psycopg[binary]",
    "alembic",
    "argon2-cffi",
    "cryptography",
    "httpx",
    "boto3",
    "dbos",
    "qdrant-client",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "anyio>=4.15.1",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]
# PDF parsing. Installed only in the worker image: it pulls in PyTorch.
ingest = [
    "docling",
    "torch",
    "torchvision",
]

# torch and torchvision are listed above only so uv resolves them from the
# CPU-only index: no CUDA libraries end up in the image.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
